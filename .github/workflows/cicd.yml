name: CICD

on:
  push:
    branches:
      - main
    paths-ignore:
      - infra/**

jobs:
  deploy-client:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: cd apps/client && pnpm install

      - name: Create .env file
        run: echo "VITE_APP_GA4_MEASUREMENT_ID=${{ secrets.VITE_APP_GA4_MEASUREMENT_ID }}" > apps/client/.env
      - name: Add API URL to .env file
        run: echo "VITE_APP_API_URL=https://ohitsthatguy.xyz" >>  apps/client/.env
      - name: Add NODE_ENV to .env file
        run: echo "NODE_ENV=production" >>  apps/client/.env

      - name: Build client
        run: cd apps/client && pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: aws s3 sync apps/client/build/client s3://ohitsthatguy.xyz --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
